version: '3.9'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: realmio_api
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    env_file:
      - .env
    networks:
      - realmio_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  admin-ui:
    build:
      context: ./admin-ui
      dockerfile: Dockerfile
    container_name: realmio_admin_ui
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_INTERNAL_API_URL=http://api:4000
    env_file:
      - ./admin-ui/.env.production
    networks:
      - realmio_net
    depends_on:
      api:
        condition: service_healthy

networks:
  realmio_net:
    driver: bridge
