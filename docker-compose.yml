# Realmio — single-service Docker Compose (P04+ Option A)
#
# Fastify serves BOTH the API and the Admin UI static export:
#   /admin          → dist/public (Next.js static export)
#   /admin/api/*    → Admin API (use cases)
#   /admin/auth/*   → Better Auth admin
#   /api/auth/*     → Tenant auth
#   /healthz        → Health check
#
# The separate admin-ui service was removed in P04.
# The admin-ui is now a static build copied into dist/public during docker build.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: realmio_api
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - realmio_net

networks:
  realmio_net:
    driver: bridge
